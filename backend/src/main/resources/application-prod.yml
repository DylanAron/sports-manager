#数据源配�?
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据�?
      master:
        url: jdbc:mysql://localhost:3306/sports-admin?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
        username: sportsAdmin
        password: aw87eCTwSyhhids6.
      # 从库数据�?
      slave:
        # 从数据源开�?默认关闭
        enabled: false
        url:
        username:
        password:
      # 初始连接�?
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时�?
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有�?
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访�?
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密�?
        login-username: ruoyi
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
# 项目相关配置
ruoyi:
  # 名称
  name: soccer
  # 版本
  version: 3.8.9
  # 版权年份
  copyrightYear: 2025
  # 文件路径（生产环境统一目录）
  profile: /data/soccer/uploadPath
  # 获取ip地址开�?
  addressEnabled: false
  # 验证码类�?math 数字计算 char 字符验证
  captchaType: math