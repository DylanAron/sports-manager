version: '3.8'

services:
  soccer-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: soccer-app:latest
    container_name: soccer-app
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - TZ=Asia/Shanghai
    volumes:
      - /app/soccer/logs:/app/logs
      - /app/soccer/uploadPath:/app/uploadPath
    # 使用 host 网络模式，让容器内的 localhost 直接访问宿主机 MySQL
    network_mode: "host"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
